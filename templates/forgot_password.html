<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Forgot Password</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(135deg,#1e3c72,#2a5298);

overflow:hidden;
}

.card{

width:420px;

background:white;

border-radius:20px;

padding:45px;

box-shadow:0 20px 60px rgba(0,0,0,.25);

animation:fade 1s;
}

@keyframes fade{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

h2{

text-align:center;

margin-bottom:25px;

color:#1e3c72;

}

input{

width:100%;

padding:15px;

margin-bottom:20px;

border-radius:12px;

border:1px solid #ccc;

font-size:15px;

}

button{

width:100%;

padding:15px;

border:none;

background:#1e3c72;

color:white;

border-radius:12px;

font-size:16px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#2a5298;

}

.error{

background:#ffd6d6;

padding:12px;

margin-bottom:20px;

border-radius:10px;

color:red;

}

.success{

background:#d8ffe5;

padding:12px;

margin-bottom:20px;

border-radius:10px;

color:green;

}

</style>

</head>

<body>

<div class="card">

<h2>Forgot Password</h2>

{% if error %}

<div class="error">{{error}}</div>

{% endif %}

{% if message %}

<div class="success">{{message}}</div>

{% endif %}

<form method="POST">

<input
type="email"
name="email"
placeholder="Registered Email"
required>

<button>

Send OTP

</button>

</form>

</div>

</body>
</html>
