<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | CrowdSight AI</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='register.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
    .validation-msg {
        font-size: 0.78rem;
        margin-top: 4px;
        margin-left: 36px;
        min-height: 18px;
        transition: color 0.3s;
    }
    .validation-msg.error { color: #ff6b6b; }
    .validation-msg.success { color: #51cf66; }
    .input-group input.invalid { border-color: #ff6b6b !important; }
    .input-group input.valid   { border-color: #51cf66 !important; }

    /* ── Password wrapper ── */
    .password-wrapper {
        position: relative;
        width: 100%;
    }
    .password-wrapper input {
        padding-right: 36px;
    }
    .toggle-password {
        position: absolute;
        right: 4px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: #94a3b8;
        font-size: 17px;
        padding: 4px;
        width: auto;
        transition: color 0.2s;
    }
    .toggle-password:hover {
        color: #475569;
        background: none;
        transform: translateY(-50%);
    }

    /* ── Strength bar ── */
    .password-strength-section {
        margin-top: 2px;
        margin-bottom: 10px;
        padding: 0 4px;
    }
    .strength-bar-track {
        width: 100%;
        height: 5px;
        background: rgba(255,255,255,0.15);
        border-radius: 3px;
        margin-top: 8px;
        overflow: hidden;
    }
    .strength-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 3px;
        transition: width 0.4s ease, background 0.4s ease;
    }
    .strength-label {
        font-size: 0.82rem;
        font-weight: 600;
        margin-top: 6px;
        color: #94a3b8;
        transition: color 0.3s;
    }

    /* ── Checklist ── */
    .password-checklist {
        list-style: none;
        padding: 0;
        margin: 8px 0 0 0;
    }
    .password-checklist li {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        padding: 3px 0;
        color: rgba(255,255,255,0.7);
        transition: color 0.3s;
    }
    .password-checklist li .check-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        font-size: 11px;
        flex-shrink: 0;
        transition: background 0.3s, color 0.3s;
    }
    .password-checklist li.fail .check-icon {
        background: rgba(239,68,68,0.2);
        color: #ef4444;
    }
    .password-checklist li.pass .check-icon {
        background: rgba(34,197,94,0.2);
        color: #22c55e;
    }
    .password-checklist li.pass {
        color: rgba(255,255,255,0.9);
    }

    /* ── Password error msg ── */
    .password-error-msg {
        font-size: 0.78rem;
        margin-top: 6px;
        min-height: 18px;
        color: #ff6b6b;
        transition: opacity 0.3s;
    }
</style>

</head>

<body>

<div class="background">
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
</div>

<div class="register-card">

    <div class="logo">
        <i class="fa-solid fa-users-viewfinder"></i>
    </div>

    <h1>Create Account</h1>

    <p>Create your CrowdSight AI account</p>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" id="registerForm">

        <div class="input-group">
            <i class="fa-solid fa-id-card"></i>
            <input
                type="text"
                name="username"
                id="username"
                placeholder="Username"
                required>
        </div>

        <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input
                type="email"
                name="email"
                id="email"
                placeholder="Email Address"
                required>
            <div class="validation-msg" id="emailMsg"></div>
        </div>

        <div class="input-group">
            <i class="fa-solid fa-phone"></i>
            <input
                type="text"
                name="phone"
                id="phone"
                placeholder="Phone Number"
                maxlength="10"
                required>
            <div class="validation-msg" id="phoneMsg"></div>
        </div>

        <div class="input-group" id="passwordGroup">
            <i class="fa-solid fa-lock"></i>
            <div class="password-wrapper">
                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Password"
                    required>
                <button type="button" class="toggle-password" id="togglePassword" tabindex="-1">
                    <i class="fa-solid fa-eye-slash"></i>
                </button>
            </div>
        </div>

        <!-- Password Strength Section -->
        <div class="password-strength-section" id="passwordStrengthSection" style="display:none;">
            <div class="strength-bar-track">
                <div class="strength-bar-fill" id="strengthBarFill"></div>
            </div>
            <div class="strength-label" id="strengthLabel"></div>

            <ul class="password-checklist">
                <li id="checkLen" class="fail">
                    <span class="check-icon"><i class="fa-solid fa-xmark"></i></span>
                    At least 8 characters
                </li>
                <li id="checkUpper" class="fail">
                    <span class="check-icon"><i class="fa-solid fa-xmark"></i></span>
                    At least 1 uppercase letter
                </li>
                <li id="checkNumber" class="fail">
                    <span class="check-icon"><i class="fa-solid fa-xmark"></i></span>
                    At least 1 number
                </li>
                <li id="checkSpecial" class="fail">
                    <span class="check-icon"><i class="fa-solid fa-xmark"></i></span>
                    At least 1 special character
                </li>
            </ul>

            <div class="password-error-msg" id="passwordErrorMsg"></div>
        </div>


        <button type="submit" id="submitBtn">
            <i class="fa-solid fa-user-plus"></i>
            Create Account
        </button>

    </form>

    <div class="bottom-link">
        Already have an account?
        <a href="{{ url_for('login') }}">
            Login
        </a>
    </div>

</div>

<script>
(function () {
    const emailInput    = document.getElementById('email');
    const phoneInput    = document.getElementById('phone');
    const passwordInput = document.getElementById('password');
    const emailMsg      = document.getElementById('emailMsg');
    const phoneMsg      = document.getElementById('phoneMsg');
    const submitBtn     = document.getElementById('submitBtn');

    /* ── Password strength elements ── */
    const strengthSection = document.getElementById('passwordStrengthSection');
    const strengthBarFill = document.getElementById('strengthBarFill');
    const strengthLabel   = document.getElementById('strengthLabel');
    const checkLen        = document.getElementById('checkLen');
    const checkUpper      = document.getElementById('checkUpper');
    const checkNumber     = document.getElementById('checkNumber');
    const checkSpecial    = document.getElementById('checkSpecial');
    const passwordErrorMsg = document.getElementById('passwordErrorMsg');
    const togglePassword  = document.getElementById('togglePassword');

    /* ── helpers ── */
    function setMsg(el, input, text, ok) {
        el.textContent = text;
        el.className = 'validation-msg ' + (ok ? 'success' : 'error');
        input.classList.toggle('valid',   ok);
        input.classList.toggle('invalid', !ok);
    }
    function clearMsg(el, input) {
        el.textContent = '';
        el.className = 'validation-msg';
        input.classList.remove('valid', 'invalid');
    }

    /* ── Toggle password visibility ── */
    togglePassword.addEventListener('click', function () {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        const icon = this.querySelector('i');
        icon.className = type === 'password' ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
    });

    /* ── Update checklist item ── */
    function updateCheck(el, passed) {
        el.className = passed ? 'pass' : 'fail';
        el.querySelector('.check-icon').innerHTML = passed
            ? '<i class="fa-solid fa-check"></i>'
            : '<i class="fa-solid fa-xmark"></i>';
    }

    /* ── email: must end with @gmail.com ── */
    const emailRe = /^[a-zA-Z0-9._%+\-]+@gmail\.com$/;
    emailInput.addEventListener('input', function () {
        const v = this.value.trim();
        if (v === '') { clearMsg(emailMsg, this); return; }
        if (emailRe.test(v)) {
            setMsg(emailMsg, this, '✓ Valid Gmail address', true);
        } else {
            setMsg(emailMsg, this, '✗ Must be a valid @gmail.com address', false);
        }
    });

    /* ── phone: exactly 10 digits ── */
    phoneInput.addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '');
        const v = this.value;
        if (v === '') { clearMsg(phoneMsg, this); return; }
        if (/^\d{10}$/.test(v)) {
            setMsg(phoneMsg, this, '✓ Valid phone number', true);
        } else {
            setMsg(phoneMsg, this, '✗ Must be exactly 10 digits (' + v.length + '/10)', false);
        }
    });

    /* ── password: real-time strength + checklist ── */
    passwordInput.addEventListener('input', function () {
        const v = this.value;

        if (v === '') {
            strengthSection.style.display = 'none';
            passwordInput.classList.remove('valid', 'invalid');
            return;
        }

        strengthSection.style.display = 'block';

        const hasLen     = v.length >= 8;
        const hasUpper   = /[A-Z]/.test(v);
        const hasNumber  = /[0-9]/.test(v);
        const hasSpecial = /[!@#$%^&*()\-_=+\[\]{};:'",.<>\/?\\|`~]/.test(v);

        /* Update checklist */
        updateCheck(checkLen, hasLen);
        updateCheck(checkUpper, hasUpper);
        updateCheck(checkNumber, hasNumber);
        updateCheck(checkSpecial, hasSpecial);

        /* Compute score 0‑4 */
        const score = [hasLen, hasUpper, hasNumber, hasSpecial].filter(Boolean).length;

        /* Strength bar */
        const levels = [
            { width: '0%',   bg: '#94a3b8', label: '',       color: '#94a3b8' },
            { width: '25%',  bg: '#ef4444', label: 'Weak',   color: '#ef4444' },
            { width: '50%',  bg: '#f97316', label: 'Fair',   color: '#f97316' },
            { width: '75%',  bg: '#eab308', label: 'Good',   color: '#eab308' },
            { width: '100%', bg: '#22c55e', label: 'Strong', color: '#22c55e' },
        ];
        const lvl = levels[score];
        strengthBarFill.style.width = lvl.width;
        strengthBarFill.style.background = lvl.bg;
        strengthLabel.textContent = lvl.label;
        strengthLabel.style.color = lvl.color;

        /* Border color */
        passwordInput.classList.toggle('valid',   score === 4);
        passwordInput.classList.toggle('invalid', score < 4);

        /* Error message */
        if (score < 4) {
            const missing = [];
            if (!hasLen)     missing.push('Password must be at least 8 characters');
            if (!hasUpper)   missing.push('Password must contain an uppercase letter');
            if (!hasNumber)  missing.push('Password must contain a number');
            if (!hasSpecial) missing.push('Password must contain a special character');
            passwordErrorMsg.textContent = missing[0]; // show first unmet rule
        } else {
            passwordErrorMsg.textContent = '';
        }
    });

    /* ── block submit if any field is invalid ── */
    document.getElementById('registerForm').addEventListener('submit', function (e) {
        const emailOk    = emailRe.test(emailInput.value.trim());
        const phoneOk    = /^\d{10}$/.test(phoneInput.value);
        const pw         = passwordInput.value;
        const pwOk       = pw.length >= 8 && /[A-Z]/.test(pw) && /[0-9]/.test(pw) && /[!@#$%^&*()\-_=+\[\]{};:'",.<>\/?\\|`~]/.test(pw);

        if (!emailOk || !phoneOk || !pwOk) {
            e.preventDefault();
            emailInput.dispatchEvent(new Event('input'));
            phoneInput.dispatchEvent(new Event('input'));
            passwordInput.dispatchEvent(new Event('input'));
        }
    });
})();
</script>

</body>
</html>
