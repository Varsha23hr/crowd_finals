<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#1e3c72,#2a5298);

overflow:hidden;

}

.card{

width:430px;

background:white;

padding:45px;

border-radius:20px;

box-shadow:0 25px 70px rgba(0,0,0,.25);

animation:slide .8s ease;

}

@keyframes slide{

from{

opacity:0;

transform:translateY(60px);

}

to{

opacity:1;

transform:translateY(0);

}

}

h2{

text-align:center;

margin-bottom:10px;

color:#1e3c72;

}

.subtitle{

text-align:center;

margin-bottom:25px;

color:#777;

font-size:14px;

}

.input-group{

position:relative;

margin-bottom:18px;

}

input{

width:100%;

padding:15px;

padding-right:50px;

border-radius:12px;

border:1px solid #ccc;

font-size:15px;

outline:none;

transition:.3s;

}

input:focus{

border-color:#1e3c72;

}

.eye{

position:absolute;

right:15px;

top:15px;

cursor:pointer;

font-size:18px;

user-select:none;

}

.progress{

height:8px;

border-radius:10px;

background:#ddd;

margin-bottom:6px;

overflow:hidden;

}

.bar{

height:100%;

width:0;

background:red;

transition:.4s;

}

#strengthText{

font-size:13px;

margin-bottom:18px;

color:#555;

}

button{

width:100%;

padding:15px;

border:none;

background:#1e3c72;

color:white;

font-size:16px;

border-radius:12px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#2a5298;

}

.error{

background:#ffd6d6;

padding:12px;

border-radius:10px;

margin-bottom:18px;

color:red;

}

</style>

</head>

<body>

<div class="card">

<h2>Create New Password</h2>

<p class="subtitle">

Choose a strong password.

</p>

{% if error %}

<div class="error">

{{ error }}

</div>

{% endif %}

<form method="POST">

<div class="input-group">

<input
type="password"
id="password"
name="password"
placeholder="New Password"
required>

<span class="eye" onclick="togglePassword('password')">

👁

</span>

</div>

<div class="progress">

<div class="bar" id="bar"></div>

</div>

<div id="strengthText">

Password Strength

</div>

<div class="input-group">

<input
type="password"
id="confirm_password"
name="confirm_password"
placeholder="Confirm Password"
required>

<span class="eye" onclick="togglePassword('confirm_password')">

👁

</span>

</div>

<button type="submit">

Reset Password

</button>

</form>

</div>

<script>

function togglePassword(id){

let x=document.getElementById(id);

if(x.type==="password"){

x.type="text";

}else{

x.type="password";

}

}

const password=document.getElementById("password");

const bar=document.getElementById("bar");

const text=document.getElementById("strengthText");

password.addEventListener("keyup",()=>{

let val=password.value;

let score=0;

if(val.length>=8)score++;

if(/[A-Z]/.test(val))score++;

if(/[0-9]/.test(val))score++;

if(/[^A-Za-z0-9]/.test(val))score++;

if(score==1){

bar.style.width="25%";

bar.style.background="red";

text.innerHTML="Weak Password";

}

else if(score==2){

bar.style.width="50%";

bar.style.background="orange";

text.innerHTML="Medium Password";

}

else if(score==3){

bar.style.width="75%";

bar.style.background="#2196f3";

text.innerHTML="Strong Password";

}

else if(score==4){

bar.style.width="100%";

bar.style.background="green";

text.innerHTML="Very Strong Password";

}

else{

bar.style.width="0";

text.innerHTML="Password Strength";

}

});

</script>

</body>
</html>
