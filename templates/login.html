<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Crowd Alert System</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='login.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="background">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>

<div class="login-container">

<div class="login-card">

<div class="logo">

<i class="fa-solid fa-users-viewfinder"></i>

</div>

<h1>Crowd Alert</h1>

<p>Secure Monitoring Dashboard</p>

{% if error %}
<div class="error">

{{ error }}

</div>
{% endif %}

<form method="POST">

<div class="input-group">

<i class="fa fa-user"></i>

<input
type="text"
name="username"
placeholder="Username"
required>

</div>

<div class="input-group">

<i class="fa fa-lock"></i>

<input
type="password"
id="password"
name="password"
placeholder="Password"
required>

<button
type="button"
class="eye"
onclick="togglePassword()">

<i id="eyeIcon"
class="fa fa-eye"></i>

</button>

</div>

<button
type="submit"
class="login-btn">

LOGIN

</button>

</form>

<div class="links">

<a href="/forgot_password">

Forgot Password?

</a>

|

<a href="/register">

Create Account

</a>

</div>

</div>

</div>

<script>

function togglePassword(){

let p=document.getElementById("password");

let eye=document.getElementById("eyeIcon");

if(p.type==="password"){

p.type="text";

eye.classList.replace("fa-eye","fa-eye-slash");

}

else{

p.type="password";

eye.classList.replace("fa-eye-slash","fa-eye");

}

}

</script>

</body>

</html>
